<body>
    <header>
        <h1>Calculadora de Área e Perímetro Formulário</h1>
        <p>
            Formulário:  Largura e Altura de um retângulo <br>
            PHP: Processa os dados para calcular a área e o perímetro <br> apresentando os dois resultados.
        </p>
    </header>
    <form action="calcularArea.php" method="post">
        <label for="largura">Largura:</label>
        <input type="number" name="largura" id="largura" step="any" required>

    </form>
