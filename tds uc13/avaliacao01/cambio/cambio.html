<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Câmbio</title>
</head>
<body>
    <header>
        <h1>Casa de Câmbio</h1>
    </header>
    <hr>
    <main>
        <fieldset>
            <legend><strong>Formulário de Câmbio:</strong></legend>
            <h2>Dados de Câmbio:</h2>
        </fieldset>
        <hr>
        <form action="processaCambio.php" method="POST">
            <label for="cliente">Nome do Cliente:</label><br><br>
            <input type="text" name="cliente" id="cliente" placeholder="Henrique Azeredo" required><br><br>

            <label for="moedaDestino">Moeda de Destino: </label><br><br>
            <input type="text" name="moedaDestino" id="moedaDestino" placeholder="USD, EUR" required><br><br>

            <label for="valorReal">Valor em Reais (R$):</label><br><br>
            <input type="number" name="valorReal" id="valorReal" placeholder="R$350.00" required><br><br>

            <label for="cotacao">Cotação do Dia:</label><br><br>
            <input type="number" name="cotacao" id="cotacao" placeholder="4.99" required><br><br>

            <button type="submit">Enviar Cotação</button>
            
        </form>
    </main>
    <hr>
    <footer>
        <a href="../index.html">Voltar ao formulário</a>
    </footer>
    
</body>
</html>
